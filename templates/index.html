<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defect Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🐞 Defect Management & Analytics Application</span>
    </div>
</nav>

<div class="container">
    <!-- Prediction & Analytics Panel -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card border-info">
                <div class="card-header bg-info text-white">
                    <h5>Defect Prediction & Summary Analytics</h5>
                </div>
                <div class="card-body">
                    <div id="predictionAlert" class="alert alert-warning">Analyzing defect data...</div>
                    <div class="row">
                        <div class="col-md-6">
                            <canvas id="severityChart"></canvas>
                        </div>
                        <div class="col-md-6">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Recording / Logging Form -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">Record New Defect</div>
                <div class="card-body">
                    <form id="defectForm">
                        <div class="mb-2">
                            <label>Title</label>
                            <input type="text" id="title" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label>Description</label>
                            <textarea id="description" class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="mb-2">
                            <label>Module</label>
                            <input type="text" id="module" class="form-control" placeholder="e.g., Auth, Payments" required>
                        </div>
                        <div class="mb-2">
                            <label>Classification Type</label>
                            <select id="type" class="form-select">
                                <option value="UI">UI / Front-End</option>
                                <option value="Backend">Backend / API</option>
                                <option value="Logic">Business Logic</option>
                                <option value="Security">Security</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label>Severity</label>
                            <select id="severity" class="form-select">
                                <option value="Critical">Critical</option>
                                <option value="Major">Major</option>
                                <option value="Minor">Minor</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label>Priority</label>
                            <select id="priority" class="form-select">
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label>Prevention Guidelines / Root Cause</label>
                            <textarea id="prevention_note" class="form-control" placeholder="How to prevent similar defects?" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-2">Submit Defect</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Defect Management & Tracking Table -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-secondary text-white">Defect Tracker</div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Module</th>
                                <th>Severity</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="defectTableBody">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function fetchDefects() {
        const res = await fetch('/api/defects');
        const defects = await res.json();
        const tbody = document.getElementById('defectTableBody');
        tbody.innerHTML = '';

        defects.forEach(d => {
            tbody.innerHTML += `
                <tr>
                    <td>#${d.id}</td>
                    <td><strong>${d.title}</strong><br><small class="text-muted">${d.description}</small></td>
                    <td>${d.module}</td>
                    <td><span class="badge bg-${d.severity === 'Critical' ? 'danger' : (d.severity === 'Major' ? 'warning' : 'secondary')}">${d.severity}</span></td>
                    <td><span class="badge bg-info">${d.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="updateStatus(${d.id})">Advance Status</button>
                    </td>
                </tr>
            `;
        });
    }

    async function fetchAnalytics() {
        const res = await fetch('/api/analytics');
        const data = await res.json();
        document.getElementById('predictionAlert').innerText = `📊 Prediction Insight: ${data.prediction_risk}`;
    }

    document.getElementById('defectForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            module: document.getElementById('module').value,
            type: document.getElementById('type').value,
            severity: document.getElementById('severity').value,
            priority: document.getElementById('priority').value,
            prevention_note: document.getElementById('prevention_note').value
        };

        await fetch('/api/defects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });

        document.getElementById('defectForm').reset();
        fetchDefects();
        fetchAnalytics();
    });

    async function updateStatus(id) {
        await fetch(`/api/defects/${id}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ status: 'Resolved' })
        });
        fetchDefects();
        fetchAnalytics();
    }

    fetchDefects();
    fetchAnalytics();
</script>

</body>
</html>
